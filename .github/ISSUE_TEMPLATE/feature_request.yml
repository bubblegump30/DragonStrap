name: Feature request
description: Suggest an improvement or new capability for DragonStrap
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Feature proposals should explain the user problem first, then the proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, workflow, or UI you would like.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Related area
      multiple: true
      options:
        - Roblox Launch Center
        - Installation & Update Engine
        - Channel & Version Manager
        - Update Center
        - Performance Center
        - FastFlag Manager
        - Server Intelligence
        - Studio Center
        - Profiles & Configuration
        - Reliability & Recovery
        - UI / UX
        - Architecture / API
        - Other

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Describe any workaround or alternative design you considered.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Optional. Add screenshots, mockups, or technical notes.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: This request does not require weakening DragonStrap's update, recovery, or Electron security safeguards.
          required: true
